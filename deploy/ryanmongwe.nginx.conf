# Add these locations inside the existing HTTPS server block for ryanmongwe.com.
# Run this project's Node process on 127.0.0.1:8787 with SECURE_COOKIES=1.
location = /games/dunkers-2 {
    return 301 /games/dunkers-2/;
}

location /games/dunkers-2/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 120s;
    client_max_body_size 2m;
}
